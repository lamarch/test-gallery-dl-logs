name: CI

on:
  push:
    branches:
      - "vibe/*"
  pull_request:

jobs:
  webui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check
        run: python -m py_compile app.py tailer.py test_tailer.py test_api.py
      - name: Unit + API tests
        run: python -m unittest test_tailer test_api -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (build context = repo root)
        run: docker build -t web-dashboard:ci .
      - name: Validate compose.example.yml
        run: |
          pip install pyyaml
          python - <<'PY'
          import yaml
          doc = yaml.safe_load(open("compose.example.yml"))
          svc = doc["services"]["webui"]
          vols = svc["volumes"]
          assert "ports" not in svc, "webui must not publish ports"
          assert svc["build"] == "./web-dashboard", svc["build"]
          assert "caddy" in svc["networks"]
          assert doc["networks"]["caddy"]["external"] is True
          assert "./downloads-2:/downloads:ro" in vols
          assert "./config/albums.txt:/config/albums.txt:ro" in vols
          assert not any(v.split(":")[0] == "./config" for v in vols), \
              "the whole config dir (cookies!) must never be mounted into webui"
          assert svc["environment"]["LOG_FILE"] == "/downloads/logs/fb-dl.log"
          assert svc["environment"]["ALBUMS_FILE"] == "/config/albums.txt"
          print("compose.example.yml OK")
          PY
          docker compose -f compose.example.yml config --quiet && echo "docker compose config OK"
