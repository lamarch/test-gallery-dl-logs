<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fb-dl — log viewer</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#0d1117;--panel:#161b22;--border:#30363d;--fg:#e6edf3;--muted:#8b949e;
  --debug:#8b949e;--info:#58a6ff;--warning:#d29922;--error:#f85149;--ok:#3fb950;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;
  background:var(--panel);border-bottom:1px solid var(--border)}
.title{font-weight:700;margin-right:6px}
.tabs{display:flex;gap:4px}
.tabs button{border-radius:6px}
.tabs button.active{background:rgba(31,111,235,.3);border-color:#1f6feb;color:var(--fg)}
input[type=search]{background:var(--bg);border:1px solid var(--border);color:var(--fg);
  border-radius:6px;padding:4px 8px;width:220px;font:inherit}
#search-count{color:var(--muted);font-size:12px}
button{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:6px;
  padding:4px 10px;cursor:pointer;font:inherit}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
button.active{background:rgba(31,111,235,.25);border-color:#1f6feb}
label.lvl{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
#stats{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
#stats b{color:var(--fg)}
#st-path{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:9px;height:9px;border-radius:50%;background:var(--error);display:inline-block}
#dot.on{background:var(--ok)}
#rej-banner{display:none;color:var(--error);font-weight:600;cursor:pointer;
  padding:2px 8px;border:1px solid var(--error);border-radius:6px;font-size:12px}
#rej-banner.active{background:rgba(248,81,73,.2)}
#statusbar{display:flex;flex-wrap:wrap;gap:8px;padding:8px 12px;background:var(--panel);
  border-bottom:1px solid var(--border)}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:8px;
  padding:5px 12px;font-size:13px;color:var(--muted)}
.chip b{color:var(--fg);font-size:14px}
.chip.ok{border-color:var(--ok)} .chip.warn{border-color:var(--warning)} .chip.err{border-color:var(--error)}
.chip.clickable{cursor:pointer}
#notice{display:none;padding:4px 12px;background:rgba(31,111,235,.15);color:var(--info);
  border-bottom:1px solid var(--border);font-size:12px}
#paused{display:none;padding:4px 12px;background:rgba(210,153,34,.15);color:var(--warning);
  border-bottom:1px solid var(--border);font-size:12px}
.view{flex:1;overflow-y:auto;display:none;padding:6px 12px}
.view.open{display:block}
#log{padding:0}
.line{white-space:pre-wrap;word-break:break-all;padding:0 12px}
.line:hover{background:rgba(22,27,34,.6)}
.line.debug{color:var(--debug)} .line.info{color:var(--info)} .line.warning{color:var(--warning)}
.line.error{color:var(--error)} .line.download{color:var(--ok)}
.line.rej{font-weight:600}
.line.event .ts{color:var(--muted)} .line.event .icon{display:inline-block;width:1.8em}
.line.hidden{display:none}
a{color:var(--info);text-decoration:none}
a:hover{text-decoration:underline}
details{margin:2px 0}
summary{cursor:pointer;padding:2px 6px;border-radius:4px}
summary:hover{background:rgba(22,27,34,.6)}
.badge{display:inline-block;padding:0 6px;border-radius:8px;font-size:11px;border:1px solid var(--border);color:var(--muted)}
.badge.done{color:var(--ok);border-color:var(--ok)}
.badge.banned,.badge.error{color:var(--error);border-color:var(--error)}
.badge.incomplete{color:var(--warning);border-color:var(--warning)}
.badge.retried{color:var(--info);border-color:var(--info)}
.stat{color:var(--muted);font-size:12px}
.stat b{color:var(--fg)}
.tree-indent{margin-left:18px;border-left:1px solid var(--border);padding-left:8px}
.photo-row{padding:1px 6px;border-radius:4px}
.photo-row:hover{background:rgba(22,27,34,.6)}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:4px;border:1px solid var(--border);vertical-align:middle;margin-right:8px}
.files-table{width:100%;border-collapse:collapse}
.files-table td{padding:3px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
select{background:var(--bg);border:1px solid var(--border);color:var(--fg);border-radius:6px;padding:4px 8px;font:inherit}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;margin-bottom:8px}
.card h3{margin:0 0 6px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <span class="title">fb-dl</span>
  <div class="tabs">
    <button id="tab-log" class="active">Log</button>
    <button id="tab-tree">Tree</button>
    <button id="tab-albums">Albums</button>
    <button id="tab-files">Files</button>
  </div>
  <span id="rej-banner" title="scraping rejections detected in the log"></span>
  <a href="/api/export" download="web-dashboard-export.json"><button>⬇ Export JSON</button></a>
  <div id="stats">
    <span id="dot" title="stream connection"></span>
    <span>lines <b id="st-lines">–</b></span>
    <span>⚠ <b id="st-warn">–</b></span>
    <span>✖ <b id="st-err">–</b></span>
    <span id="st-size"></span>
    <span id="st-path"></span>
  </div>
</header>
<div id="statusbar"></div>
<div id="view-log" class="view open">
  <div class="controls">
    <input id="search" type="search" placeholder="Search logs…">
    <span id="search-count"></span>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="debug" checked>debug</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="info" checked>info</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="warning" checked>warning</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="error" checked>error</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="other" checked>other</label>
    <button id="btn-view-raw" class="active">Raw</button>
    <button id="btn-view-parsed">Parsed</button>
    <button id="btn-earlier" disabled>⤒ Load earlier</button>
    <button id="btn-pause">⏸ Pause</button>
    <button id="btn-scroll" class="active">↓ Auto-scroll</button>
    <button id="btn-clear">Clear</button>
    <a href="/api/raw" download="fb-dl.log"><button>⬇ Raw log</button></a>
  </div>
  <div id="notice"></div>
  <div id="paused"></div>
  <div id="log"></div>
</div>
<div id="view-tree" class="view"></div>
<div id="view-albums" class="view"></div>
<div id="view-files" class="view">
  <div class="controls">
    <select id="files-album"><option value="">all albums</option></select>
    <select id="files-state">
      <option value="all">all states</option>
      <option value="synced">exif synced</option>
      <option value="mismatch">exif mismatch</option>
      <option value="no_exif">script not run (no exif)</option>
    </select>
    <input id="files-q" type="search" placeholder="name / fbid…">
    <button id="files-refresh">Rescan disk</button>
    <span id="files-count" class="stat"></span>
  </div>
  <div id="files-list"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const logEl = $("log"), searchEl = $("search"), searchCount = $("search-count");
const pausedEl = $("paused"), noticeEl = $("notice"), dot = $("dot"), rejBanner = $("rej-banner");
const statusbar = $("statusbar"), earlierBtn = $("btn-earlier");
const INITIAL_TAIL = 1000;
let MAX_NODES = 20000, offset = 0, firstOffset = 0, hasMore = false;
let paused = false, pending = [], autoScroll = true, onlyRej = false;
let viewMode = "raw", allLines = [], searchTimer = null;
let tab = "log";

const LEVEL_RE = /^(?:\[[^\]]*\]\s*)?\[[^\]]*\]\[(debug|info|warning|error|critical)\]/;
const PROGRESS_RE = /^\[\d+\/\d+\]/;
const TS_RE = /^\[([^\]]+)\]\s*\[([^\]]*)\]\[(\w+)\]\s?(.*)$/;
// keep in sync with REJECTION_RE in app.py (no bare \b429\b: matches "[429/500]")
const REJECTION_RE = /temporarily blocked|blocked from viewing|must be logged in|logged in to continue|AuthRequired|AuthorizationError|AuthenticationError|Invalid login credentials|credentials required|cookies needed|Too Many Requests|ChallengeError|captcha|FunCaptcha|GeeTest|hCaptcha|HttpError: '(?:401|403|429)|content isn't available/i;

function levelOf(line) {
  const m = LEVEL_RE.exec(line);
  if (m) return m[1] === "critical" ? "error" : m[1];
  if (!line.trim() || line.startsWith("# ") || PROGRESS_RE.test(line)) return "other";
  return "download";
}
function isVisible(el) {
  if (onlyRej && !el.dataset.rej) return false;
  const q = searchEl.value.trim().toLowerCase();
  if (q && !el.textContent.toLowerCase().includes(q)) return false;
  let lvl = el.dataset.lvl;
  if (lvl === "download") lvl = "other";
  const cb = document.querySelector('.cb[data-lvl="' + lvl + '"]');
  return cb ? cb.checked : true;
}
function humanSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KiB";
  return (n / 1048576).toFixed(1) + " MiB";
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
// log timestamps are UTC ("YYYY-MM-DD HH:MM:SS"); display them in DISPLAY_TZ
let TZ = "UTC";
let tzFmt = null;
function tzFormatter() {
  if (!tzFmt) {
    const opts = { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
    try { tzFmt = new Intl.DateTimeFormat(undefined, opts); }
    catch (e) { TZ = "UTC"; tzFmt = new Intl.DateTimeFormat(undefined, Object.assign({}, opts, { timeZone: "UTC" })); }
  }
  return tzFmt;
}
function setTZ(tz) { if (tz && tz !== TZ) { TZ = tz; tzFmt = null; } }
function fmtEpoch(sec) { return tzFormatter().format(new Date(sec * 1000)); }
function fmtTs(s) {
  if (!s) return "";
  const d = new Date(String(s).slice(0, 19).replace(" ", "T") + "Z");
  return isNaN(d.getTime()) ? String(s) : tzFormatter().format(d);
}
function parseEvent(line) {
  const m = TS_RE.exec(line);
  const ts = m ? m[1] : "";
  let lvl = m ? m[3].toLowerCase() : "other";
  if (lvl === "critical") lvl = "error";
  const msg = m ? m[4] : line;
  let icon = "•", text = msg, mm;
  if (REJECTION_RE.test(line)) icon = "🚫";
  else if ((mm = msg.match(/^Sleeping ([\d.]+) seconds \(([^)]+)\)/))) { icon = "💤"; text = "sleeping " + mm[1] + "s (" + mm[2] + ")"; }
  else if ((mm = msg.match(/^Starting (\w+)Job for '([^']+)'/))) { icon = "▶"; text = mm[1] + " job — " + mm[2]; }
  else if ((mm = msg.match(/^Using (\w+) for '([^']+)'/))) { icon = "🔍"; text = mm[1] + " — " + trunc(mm[2], 100); }
  else if ((mm = msg.match(/"GET ([^"]+) HTTP\/1\.1" (\d{3})(?: (\d+))?$/))) { icon = "🌐"; text = "GET " + mm[2] + (mm[3] ? " (" + humanSize(+mm[3]) + ")" : "") + " — " + trunc(mm[1], 90); }
  else if ((mm = msg.match(/^Adjusting filename extension of '([^']+)' to '(\w+)'/))) { icon = "🖼"; text = mm[1] + " → ." + mm[2]; }
  else if (msg.match(/^Failed to download '/)) { icon = "❌"; }
  else if (/^Starting new HTTPS connection/.test(msg)) { icon = "🔌"; }
  else if (/^Resetting dropped connection/.test(msg)) { icon = "🔁"; }
  else if (/^Version /.test(msg)) { icon = "🔄"; text = msg; }
  else icon = { debug: "·", info: "ℹ", warning: "⚠", error: "✖" }[lvl] || "•";
  return { ts, lvl, icon, text };
}
function makeDiv(line) {
  const lvl = levelOf(line);
  const rej = REJECTION_RE.test(line);
  const div = document.createElement("div");
  div.dataset.lvl = lvl;
  if (rej) div.dataset.rej = "1";
  let cls = "line";
  if (viewMode === "parsed") {
    const ev = parseEvent(line);
    cls += " event " + ev.lvl;
    const ts = document.createElement("span"); ts.className = "ts"; ts.textContent = ev.ts ? fmtTs(ev.ts) + " " : "";
    const ic = document.createElement("span"); ic.className = "icon"; ic.textContent = ev.icon;
    const tx = document.createElement("span"); tx.textContent = ev.text;
    div.append(ts, ic, tx);
  } else {
    cls += " " + lvl;
    div.textContent = line;
  }
  if (rej) cls += " rej";
  div.className = cls;
  if (!isVisible(div)) div.classList.add("hidden");
  return div;
}
function appendLine(line) {
  allLines.push(line);
  if (allLines.length > MAX_NODES) allLines.shift();
  logEl.appendChild(makeDiv(line));
  while (logEl.childElementCount > MAX_NODES) logEl.firstChild.remove();
  if (autoScroll && !paused) logEl.scrollTop = logEl.scrollHeight;
}
function prependLines(lines) {
  allLines = lines.concat(allLines);
  if (allLines.length > MAX_NODES) allLines = allLines.slice(-MAX_NODES);
  const frag = document.createDocumentFragment();
  for (const line of lines) frag.appendChild(makeDiv(line));
  logEl.insertBefore(frag, logEl.firstChild);
}
function setDot(on) { dot.classList.toggle("on", on); }
function connect() {
  const es = new EventSource("/api/stream?since=" + offset);
  es.addEventListener("log", (ev) => {
    setDot(true);
    const msg = JSON.parse(ev.data);
    offset = msg.offset;
    if (paused) {
      pending.push(msg.line);
      if (pending.length > MAX_NODES) pending.shift();
      pausedEl.style.display = "block";
      pausedEl.textContent = "⏸ Paused — " + pending.length + " new line(s) — click \"Resume\"";
    } else {
      appendLine(msg.line);
    }
  });
  es.onopen = () => setDot(true);
  es.onerror = () => setDot(false);
}
function setPath(p) { $("st-path").textContent = p; $("st-path").title = p; }
function updateEarlierBtn() { earlierBtn.disabled = !hasMore; }
async function loadHistory() {
  fetch("/api/status").then(r => r.json()).then(st => setTZ(st.timezone)).catch(() => {});
  try {
    const r = await fetch("/api/logs?tail=" + INITIAL_TAIL);
    const data = await r.json();
    MAX_NODES = data.max_render || MAX_NODES;
    setPath(data.path);
    firstOffset = data.start_offset;
    hasMore = data.has_more;
    updateEarlierBtn();
    const frag = document.createDocumentFragment();
    for (const line of data.lines) { allLines.push(line); frag.appendChild(makeDiv(line)); }
    logEl.appendChild(frag);
    if (allLines.length >= MAX_NODES) {
      noticeEl.style.display = "block";
      noticeEl.textContent = "Display capped at " + MAX_NODES + " lines. Use \"Load earlier\" or search (match count covers the scanned file).";
    }
    offset = data.offset;
  } catch (e) { /* no log yet */ }
  connect();
}
async function loadEarlier() {
  if (!hasMore) return;
  earlierBtn.disabled = true;
  try {
    const r = await fetch("/api/logs?before=" + firstOffset + "&limit=2000");
    const data = await r.json();
    firstOffset = data.start_offset;
    hasMore = data.has_more;
    prependLines(data.lines);
  } catch (e) {}
  updateEarlierBtn();
}
function toggleView(mode) {
  if (viewMode === mode) return;
  viewMode = mode;
  $("btn-view-raw").classList.toggle("active", mode === "raw");
  $("btn-view-parsed").classList.toggle("active", mode === "parsed");
  logEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const line of allLines) frag.appendChild(makeDiv(line));
  logEl.appendChild(frag);
  if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
}
function refilter() {
  for (const el of logEl.children) el.classList.toggle("hidden", !isVisible(el));
}

// ---------------------------------------------------------------- tabs
function showTab(name) {
  tab = name;
  for (const t of ["log", "tree", "albums", "files"]) {
    $("tab-" + t).classList.toggle("active", t === name);
    $("view-" + t).classList.toggle("open", t === name);
  }
  if (name === "tree") loadTree();
  if (name === "albums") loadOverview();
  if (name === "files") loadFiles();
}
for (const t of ["log", "tree", "albums", "files"])
  $("tab-" + t).addEventListener("click", () => showTab(t));

// ---------------------------------------------------------------- tree view
async function loadTree() {
  try {
    const t = await (await fetch("/api/tree")).json();
    renderTree(t);
  } catch (e) {}
}
function badge(txt, cls) { return '<span class="badge ' + cls + '">' + esc(txt) + "</span>"; }
function statsLine(o) {
  return '<span class="stat">🖼 <b>' + o.photos_n + '</b> photos · 📥 <b>' + o.files +
    '</b> files · 💾 <b>' + humanSize(o.bytes) + '</b> · 💤 <b>' + o.sleeps.toFixed(1) +
    's</b> sleep' + (o.errors ? ' · ✖ <b>' + o.errors + '</b>' : '') +
    (o.rejections ? ' · 🚫 <b>' + o.rejections + '</b>' : '') + "</span>";
}
function renderTree(t) {
  const el = $("view-tree");
  el.innerHTML = "";
  if (!t.sessions.length) { el.innerHTML = "<p class='stat'>no sessions parsed yet</p>"; return; }
  for (const s of t.sessions) {
    const det = document.createElement("details");
    det.open = true;
    const sum = document.createElement("summary");
    sum.innerHTML = "🔄 <b>session #" + s.idx + "</b> — started " + fmtTs(s.start) +
      " → " + fmtTs(s.end) + " &nbsp;" + statsLine(s);
    det.appendChild(sum);
    const box = document.createElement("div");
    box.className = "tree-indent";
    for (const a of s.albums) {
      const ad = document.createElement("details");
      const asum = document.createElement("summary");
      asum.innerHTML = "📁 <b>album " + a.idx + "</b> " +
        (a.link ? '<a href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(trunc(a.url, 60)) + "</a>" : esc(trunc(a.url, 60))) +
        " &nbsp;" + badge(a.status, a.status) +
        (a.set_id ? ' <span class="stat">set=a.' + esc(a.set_id) + "</span>" : "") +
        ' <span class="stat">' + fmtTs(a.start) + " → " + fmtTs(a.end) + " — " + esc(a.end_reason || "") + "</span>" +
        "<br>" + statsLine(a);
      ad.appendChild(asum);
      const abox = document.createElement("div");
      abox.className = "tree-indent";
      const logsBtn = document.createElement("button");
      logsBtn.textContent = "📜 album logs";
      logsBtn.addEventListener("click", async () => {
        const r = await (await fetch("/api/album/" + s.idx + "/" + a.idx + "/logs?limit=2000")).json();
        const pre = document.createElement("pre");
        pre.style.cssText = "max-height:300px;overflow:auto;background:var(--bg);padding:6px;border-radius:6px";
        pre.textContent = r.lines.join("\n");
        abox.appendChild(pre);
        logsBtn.remove();
      });
      abox.appendChild(logsBtn);
      const pdet = document.createElement("details");
      const psum = document.createElement("summary");
      psum.textContent = "🖼 photos (" + a.photos_n + ") — click to load";
      pdet.appendChild(psum);
      const pbox = document.createElement("div");
      pbox.className = "tree-indent";
      pdet.appendChild(pbox);
      let loaded = false;
      pdet.addEventListener("toggle", async () => {
        if (!pdet.open || loaded) return;
        loaded = true;
        await loadAlbumPhotos(s.idx, a.idx, pbox, 0);
      });
      abox.appendChild(pdet);
      ad.appendChild(abox);
      box.appendChild(ad);
    }
    det.appendChild(box);
    el.appendChild(det);
  }
}
async function loadAlbumPhotos(s, a, el, offset) {
  const r = await (await fetch("/api/album/" + s + "/" + a + "?offset=" + offset + "&limit=500")).json();
  for (const p of r.photos) {
    const row = document.createElement("div");
    row.className = "photo-row";
    const icon = p.status === "downloaded" ? "🖼" : p.status === "failed" ? "❌" : "⏳";
    let html = icon + " " + fmtTs(p.ts) + " ";
    if (p.link_photo) html += '<a href="' + esc(p.link_photo) + '" target="_blank" rel="noopener">fbid=' + esc(p.fbid || "?") + "</a> ";
    else html += "fbid=" + esc(p.fbid || "?") + " ";
    html += '<span class="stat">' + esc(p.file || p.status) +
      (p.bytes ? " · " + humanSize(p.bytes) : "") +
      (p.sleep ? " · 💤" + p.sleep.toFixed(1) + "s" : "") +
      (p.on_disk ? ' · 💾 on disk' : ' · <span style="color:var(--warning)">not on disk</span>') + "</span>";
    row.innerHTML = html;
    const det = document.createElement("details");
    const sum = document.createElement("summary");
    sum.textContent = "details (exif / logs)";
    det.appendChild(sum);
    const dbox = document.createElement("div");
    dbox.className = "tree-indent";
    det.appendChild(dbox);
    let loaded = false;
    det.addEventListener("toggle", async () => {
      if (!det.open || loaded) return;
      loaded = true;
      if (p.path) {
        const ex = await (await fetch("/api/exif?path=" + encodeURIComponent(p.path))).json();
        dbox.insertAdjacentHTML("beforeend",
          '<div class="stat">exif: ' + esc(ex.exif || "none") + " · mtime: " + esc(fmtEpoch(ex.mtime)) +
          " · name-date: " + esc(ex.name_date || "?") + " · state: " + badge(ex.state, ex.state === "synced" ? "done" : "error") + "</div>");
      }
      const lg = await (await fetch("/api/photo/" + s + "/" + a + "/" + p.idx + "/logs?limit=500")).json();
      const pre = document.createElement("pre");
      pre.style.cssText = "max-height:260px;overflow:auto;background:var(--bg);padding:6px;border-radius:6px";
      pre.textContent = lg.lines.join("\n");
      dbox.appendChild(pre);
    });
    row.appendChild(det);
    el.appendChild(row);
  }
  if (r.photos.length + offset < r.photos_n) {
    const more = document.createElement("button");
    more.textContent = "⤓ load more photos (" + (r.photos_n - offset - r.photos.length) + " left)";
    more.addEventListener("click", () => { more.remove(); loadAlbumPhotos(s, a, el, offset + r.photos.length); });
    el.appendChild(more);
  }
}

// ---------------------------------------------------------------- albums view
async function loadOverview() {
  try {
    const o = await (await fetch("/api/albums_overview")).json();
    renderOverview(o);
  } catch (e) {}
}
function renderOverview(o) {
  const el = $("view-albums");
  el.innerHTML = "";
  if (!o.albums.length) { el.innerHTML = "<p class='stat'>no albums parsed yet</p>"; return; }
  for (const a of o.albums) {
    const card = document.createElement("div");
    card.className = "card";
    card.id = "album-" + (a.set_id || encodeURIComponent(a.url));
    card.innerHTML = "<h3>📁 " +
      (a.link ? '<a href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(trunc(a.url, 70)) + "</a>" : esc(trunc(a.url, 70))) +
      " " + badge(a.status, a.status) + (a.retried ? " " + badge("retried", "retried") : "") +
      (a.set_id ? ' <span class="stat">set=a.' + esc(a.set_id) + (a.vanity ? " · vanity=" + esc(a.vanity) : "") + "</span>" : "") +
      "</h3><div class='stat'>sessions: " + a.sessions.map(x => "#" + x).join(", ") +
      " · " + statsLine(a) + " · 💾 on disk: <b>" + a.on_disk + "</b> files" +
      (a.end_reason ? " · end: " + esc(a.end_reason) : "") + "</div>";
    el.appendChild(card);
  }
  applyAnchor();
}
function applyAnchor() {
  const h = location.hash;
  if (!h.startsWith("#album=")) return;
  const key = decodeURIComponent(h.slice(7));
  const card = $("album-" + CSS.escape(key)) || $("album-" + encodeURIComponent(key));
  if (card) { card.scrollIntoView(); card.style.borderColor = "var(--info)"; }
}
window.addEventListener("hashchange", applyAnchor);

// ---------------------------------------------------------------- files view
let filesData = null;
const exifCache = {};
function exifOf(path) {
  if (!exifCache[path]) {
    exifCache[path] = fetch("/api/exif?path=" + encodeURIComponent(path))
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .catch(() => null);
  }
  return exifCache[path];
}
async function loadFiles(refresh) {
  try {
    filesData = await (await fetch("/api/files" + (refresh ? "?refresh=1" : ""))).json();
    renderFiles();
  } catch (e) {}
}
function renderFiles() {
  const el = $("files-list");
  if (!filesData) return;
  const albumSel = $("files-album");
  const curAlbum = albumSel.value, curState = $("files-state").value, q = $("files-q").value.trim().toLowerCase();
  const albums = [...new Set(filesData.files.map(f => f.album_set).filter(Boolean))].sort();
  if (albumSel.options.length <= 1) {
    for (const a of albums) {
      const o = document.createElement("option");
      o.value = a; o.textContent = a;  // album_set already includes the "a." prefix
      albumSel.appendChild(o);
    }
    albumSel.value = curAlbum || "";
  }
  el.innerHTML = "";
  const table = document.createElement("table");
  table.className = "files-table";
  let shown = 0, matched = 0;
  for (const f of filesData.files) {
    if (albumSel.value && f.album_set !== albumSel.value) continue;
    if (q && !(f.name.toLowerCase().includes(q) || (f.fbid || "").includes(q))) continue;
    matched++;
    if (shown >= 2000) break;
    shown++;
    const row = document.createElement("tr");
    row.innerHTML = '<td><img class="thumb" loading="lazy" src="/api/file?path=' + encodeURIComponent(f.path) + '"></td>' +
      "<td>" + esc(f.name) + (f.fbid ? '<br><span class="stat">fbid=' + esc(f.fbid) + "</span>" : "") + "</td>" +
      '<td class="stat">' + humanSize(f.size) + "</td>" +
      '<td class="stat">' + esc(f.name_date || "?") + "</td>" +
      '<td class="stat">' + esc(fmtEpoch(f.mtime)) + "</td>" +
      '<td class="stat">' + esc(f.album_set || "?") + "</td>" +
      '<td><button class="exif-btn">exif</button><span class="exif-res"></span></td>';
    const btn = row.querySelector(".exif-btn");
    const res = row.querySelector(".exif-res");
    const paintExif = async () => {
      const ex = await exifOf(f.path);
      if (!ex) { res.textContent = "error"; return; }
      res.innerHTML = badge(ex.state, ex.state === "synced" ? "done" : "error") +
        " " + esc(ex.exif || "no exif") + (ex.diff_s != null ? " (Δ" + ex.diff_s + "s)" : "");
      if (curState !== "all") row.style.display = ex.state === curState ? "" : "none";
    };
    let done = false;
    btn.addEventListener("click", async () => {
      if (done) return;
      done = true;
      btn.disabled = true;
      await paintExif();
    });
    if (curState !== "all") paintExif();  // lazy state filter ("script not run" = no_exif)
    table.appendChild(row);
  }
  el.appendChild(table);
  $("files-count").textContent = filesData.count + " file(s) on disk" +
    (filesData.truncated ? " (index capped at FILES_MAX)" : "") + ", " + matched + " shown";
  if (!shown) el.innerHTML = "<p class='stat'>no files</p>";
}
$("files-album").addEventListener("change", renderFiles);
$("files-state").addEventListener("change", renderFiles);
$("files-q").addEventListener("input", renderFiles);
$("files-refresh").addEventListener("click", () => loadFiles(true));

// ---------------------------------------------------------------- header controls
searchEl.addEventListener("input", () => {
  refilter();
  clearTimeout(searchTimer);
  const q = searchEl.value.trim();
  if (!q) { searchCount.textContent = ""; return; }
  searchTimer = setTimeout(async () => {
    try {
      const s = await (await fetch("/api/search?q=" + encodeURIComponent(q) + "&limit=1")).json();
      searchCount.textContent = s.count + " match(es)" + (s.truncated ? " (tail scan)" : "");
    } catch (e) {}
  }, 300);
});
document.querySelectorAll(".cb").forEach(cb => cb.addEventListener("change", refilter));
rejBanner.addEventListener("click", () => {
  onlyRej = !onlyRej;
  rejBanner.classList.toggle("active", onlyRej);
  refilter();
});
$("btn-view-raw").addEventListener("click", () => toggleView("raw"));
$("btn-view-parsed").addEventListener("click", () => toggleView("parsed"));
$("btn-earlier").addEventListener("click", loadEarlier);
$("btn-clear").addEventListener("click", () => { logEl.innerHTML = ""; allLines = []; });
$("btn-scroll").addEventListener("click", (e) => {
  autoScroll = !autoScroll;
  e.target.classList.toggle("active", autoScroll);
  if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
});
$("btn-pause").addEventListener("click", (e) => {
  paused = !paused;
  e.target.textContent = paused ? "▶ Resume" : "⏸ Pause";
  e.target.classList.toggle("active", paused);
  if (!paused) {
    pausedEl.style.display = "none";
    const lines = pending; pending = [];
    lines.forEach(appendLine);
    if (autoScroll) logEl.scrollTop = logEl.scrollHeight;
  }
});

// ---------------------------------------------------------------- poll (chips + statusbar)
async function poll() {
  try {
    const s = await (await fetch("/api/stats")).json();
    $("st-lines").textContent = s.lines + (s.truncated ? " (tail)" : "");
    $("st-warn").textContent = s.warnings;
    $("st-err").textContent = s.errors;
    const nrej = s.rejections || 0;
    if (nrej > 0) {
      rejBanner.style.display = "";
      rejBanner.textContent = "🚫 " + nrej + " rejection(s) — click to filter";
    } else {
      rejBanner.style.display = "none";
      if (onlyRej) { onlyRej = false; rejBanner.classList.remove("active"); refilter(); }
    }
    const st = await (await fetch("/api/status")).json();
    setTZ(st.timezone);
    $("st-size").textContent = st.exists ? humanSize(st.size) : "no log file yet";
    const a = await (await fetch("/api/albums")).json();
    const t = await (await fetch("/api/tree")).json();

    const chips = [];
    let stateChip;
    if (s.last_sleep) {
      const until = Date.parse(s.last_sleep.at.replace(" ", "T") + "Z") + s.last_sleep.seconds * 1000;
      stateChip = "💤 <b>sleeping " + s.last_sleep.seconds + "s</b> (" + esc(s.last_sleep.reason) + ")" +
        (Date.now() < until ? " — wakes <b>" + fmtEpoch(until / 1000) + "</b>" : " — (elapsed)");
    } else {
      stateChip = "▶ <b>working</b>";
    }
    if (t.runs) stateChip += ' &nbsp; 🔄 run <b>#' + (t.runs - 1) + "</b> started " + fmtTs(t.sessions[t.runs - 1].start);
    chips.push('<span class="chip">' + stateChip + "</span>");
    if (s.current_album) chips.push('<span class="chip clickable" id="chip-album">📁 <b>' + esc(trunc(s.current_album, 50)) + "</b> · 🖼 " + s.current_album_files + " files</span>");
    if (a.available) chips.push('<span class="chip ok">✓ albums <b>' + a.counts.done + "/" + a.counts.total + "</b>" +
      (a.counts.incomplete ? ' · ◐' + a.counts.incomplete : "") + (a.counts.not_started ? ' · ○' + a.counts.not_started : "") + "</span>");
    chips.push('<span class="chip">🖼 <b>' + s.files + "</b> files</span>");
    chips.push('<span class="chip ' + (s.errors ? "err" : "") + '">✖ <b>' + s.errors + "</b></span>");
    chips.push('<span class="chip ' + (nrej ? "err" : "") + '">🚫 <b>' + nrej + "</b></span>");
    if (st.exists) chips.push('<span class="chip">last activity <b>' + fmtEpoch(st.mtime) + "</b> (" + esc(TZ) + ")</span>");
    statusbar.innerHTML = chips.join("");
    const chipAlbum = $("chip-album");
    if (chipAlbum) chipAlbum.addEventListener("click", () => { showTab("albums"); });
  } catch (e) {}
  setTimeout(poll, 5000);
}

loadHistory();
poll();
applyAnchor();
</script>
