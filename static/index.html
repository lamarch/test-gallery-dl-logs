<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fb-dl — log viewer</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f8f9fa; --panel:#ffffff; --border:#dee2e6; --fg:#212529; --muted:#6c757d;
  --blue:#0d6efd; --ok:#198754; --warning:#b45309; --error:#dc3545;
  --debug:#6c757d;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 16px;
  background:var(--panel);border-bottom:1px solid var(--border);box-shadow:0 1px 2px rgba(16,24,40,.06)}
.title{font-weight:700;font-size:16px;margin-right:8px}
.tabs{display:flex;gap:4px}
.tabs button{border-radius:.375rem}
.tabs button.active{background:var(--blue);border-color:var(--blue);color:#fff}
input[type=search]{background:#fff;border:1px solid #ced4da;color:var(--fg);
  border-radius:.375rem;padding:.375rem .75rem;width:220px;font:inherit}
#search-count{color:var(--muted);font-size:12px}
button{background:#fff;border:1px solid #ced4da;color:var(--fg);border-radius:.375rem;
  padding:.375rem .75rem;cursor:pointer;font:inherit}
button:hover{background:#f1f3f5;border-color:#adb5bd}
button:disabled{opacity:.5;cursor:default}
button.active{background:#e7f1ff;border-color:var(--blue);color:var(--blue)}
label.lvl{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
#stats{margin-left:auto;display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
#stats b{color:var(--fg)}
#st-path{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dot{width:10px;height:10px;border-radius:50%;background:var(--error);display:inline-block}
#dot.on{background:var(--ok)}
#rej-banner{display:none;color:var(--error);font-weight:600;cursor:pointer;
  padding:2px 10px;border:1px solid var(--error);border-radius:2rem;font-size:12px;background:#fff}
#rej-banner.active{background:#f8d7da}
#statusbar{background:var(--panel);border-bottom:1px solid var(--border);padding:6px 16px;
  display:flex;flex-direction:column;gap:3px}
.sb-line{display:flex;flex-wrap:wrap;gap:5px;font-size:13px}
.sb-part{background:#e9ecef;border:1px solid var(--border);border-radius:2rem;padding:2px 10px;white-space:nowrap}
.sb-part b{color:var(--fg)}
#notice{display:none;padding:6px 16px;background:#cff4fc;color:#055160;
  border-bottom:1px solid var(--border);font-size:13px}
#paused{display:none;padding:6px 16px;background:#fff3cd;color:#664d03;
  border-bottom:1px solid var(--border);font-size:13px}
.view{flex:1;overflow-y:auto;display:none;padding:12px 16px}
.view.open{display:block}
#log{padding:0;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
.line{white-space:pre-wrap;word-break:break-all;padding:1px 12px}
.line:hover{background:#e9ecef}
.line.debug{color:var(--debug)} .line.info{color:#0a58ca} .line.warning{color:var(--warning)}
.line.error{color:var(--error)} .line.download{color:var(--ok)}
.line.rej{font-weight:600;background:#f8d7da}
.line.event .ts{color:var(--muted)} .line.event .icon{display:inline-block;width:1.8em}
.line.hidden{display:none}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
details{margin:2px 0}
summary{cursor:pointer;padding:4px 8px;border-radius:.375rem;font-weight:500}
summary:hover{background:#e9ecef}
.badge{display:inline-block;padding:.15em .6em;border-radius:.375rem;font-size:11px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.badge.done,.badge.downloaded{color:#fff;background:var(--ok);border-color:var(--ok)}
.badge.banned,.badge.error,.badge.failed{color:#fff;background:var(--error);border-color:var(--error)}
.badge.incomplete,.badge.missing{color:#664d03;background:#ffc107;border-color:#ffc107}
.badge.retried,.badge.already,.badge.not_in_file{color:#fff;background:var(--blue);border-color:var(--blue)}
.badge.pending,.badge.foreign,.badge.interrupted{color:#fff;background:#6c757d;border-color:#6c757d}
.badge.running{color:#084298;background:#cfe2ff;border-color:#b6d4fe}
.stat{color:var(--muted);font-size:12px}
.stat b{color:var(--fg)}
.tree-indent{margin-left:18px;border-left:2px solid var(--border);padding-left:10px}
.tnode.hidden{display:none}
.n-l1{font-weight:500}
.n-l2,.n-l3{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-weight:400}
.n-l2 b,.n-l3 b{color:var(--fg)}
.cnt{white-space:nowrap}
a.cnt{text-decoration:none}
.photo{padding:4px 8px;border-radius:.375rem}
.photo:hover{background:#f1f3f5}
.copy-btn{padding:0 6px;font-size:11px;line-height:1.5;margin-left:2px}
.logs-btn{font-size:11px;padding:1px 8px}
.more-btn{margin:6px 0;font-size:12px}
.thumb40{width:40px;height:40px;object-fit:cover;border-radius:.375rem;border:1px solid var(--border);vertical-align:middle;margin-right:6px}
.thumb{width:56px;height:56px;object-fit:cover;border-radius:.375rem;border:1px solid var(--border);vertical-align:middle;margin-right:8px}
.logpane{max-height:300px;overflow:auto;background:var(--bg);padding:6px;border-radius:6px;
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
.files-table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--border);border-radius:.5rem}
.files-table td,.files-table th{padding:6px 10px;border-bottom:1px solid var(--border);vertical-align:middle;font-size:13px;text-align:left}
.files-table tr:hover{background:#f1f3f5}
tr.hl{background:#fff3cd !important}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
select{background:#fff;border:1px solid #ced4da;color:var(--fg);border-radius:.375rem;padding:.375rem .75rem;font:inherit}
.card{background:var(--panel);border:1px solid var(--border);border-radius:.5rem;padding:12px 16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h3{margin:0 0 8px 0;font-size:16px}
.compare-table{margin-bottom:16px}
.compare-table th{color:var(--muted);font-size:12px}
.acmp.hidden{display:none}
</style>
</head>
<body>
<header>
  <span class="title">fb-dl</span>
  <div class="tabs">
    <button id="tab-log" class="active">Log</button>
    <button id="tab-tree">Tree</button>
    <button id="tab-albums">Albums</button>
    <button id="tab-files">Files</button>
  </div>
  <span id="rej-banner" title="Scraping rejections detected in the log — click to jump to the first rejection line in the Log tab"></span>
  <a href="/api/export" download="web-dashboard-export.json"><button>⬇ Export JSON</button></a>
  <div id="stats">
    <span id="dot" title="stream connection"></span>
    <span>lines <b id="st-lines">–</b></span>
    <span>⚠ <b id="st-warn">–</b></span>
    <span>✖ <b id="st-err">–</b></span>
    <span id="st-size"></span>
    <span id="st-path"></span>
  </div>
</header>
<div id="statusbar">
  <div class="sb-line" id="sb-l1"></div>
  <div class="sb-line" id="sb-l2"></div>
  <div class="sb-line" id="sb-l3"></div>
</div>
<div id="view-log" class="view open">
  <div class="controls">
    <input id="search" type="search" placeholder="Search logs…">
    <span id="search-count"></span>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="debug" checked>debug</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="info" checked>info</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="warning" checked>warning</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="error" checked>error</label>
    <label class="lvl"><input type="checkbox" class="cb" data-lvl="other" checked>other</label>
    <button id="btn-view-raw" class="active">Raw</button>
    <button id="btn-view-parsed">Parsed</button>
    <button id="btn-earlier" disabled>⏒ Load earlier</button>
    <button id="btn-pause">⏸ Pause</button>
    <button id="btn-scroll" class="active">↓ Auto-scroll</button>
    <button id="btn-clear">Clear</button>
    <a href="/api/raw" download="fb-dl.log"><button>⬇ Raw log</button></a>
  </div>
  <div id="notice"></div>
  <div id="paused"></div>
  <div id="log"></div>
</div>
<div id="view-tree" class="view">
  <div class="controls">
    <input id="tree-q" type="search" placeholder="Filter tree (album name, set id, fbid)…">
    <span id="tree-count" class="stat"></span>
  </div>
  <div id="tree-root"></div>
</div>
<div id="view-albums" class="view">
  <div class="controls">
    <input id="albums-q" type="search" placeholder="Filter albums (name, set id, url)…">
  </div>
  <div id="albums-compare"></div>
  <div id="albums-root"></div>
</div>
<div id="view-files" class="view">
  <div class="controls">
    <select id="files-album"><option value="">all albums</option></select>
    <select id="files-state">
      <option value="all">all files</option>
      <option value="full">full (downloaded in logs + on disk)</option>
      <option value="already">already (page seen in logs, skipped)</option>
      <option value="foreign">foreign (on disk, never in logs)</option>
      <option value="synced">exif synced</option>
      <option value="mismatch">exif mismatch</option>
      <option value="no_exif">no exif (script not run)</option>
    </select>
    <input id="files-q" type="search" placeholder="name / fbid…">
    <button id="files-refresh">Rescan disk</button>
    <span id="files-count" class="stat"></span>
  </div>
  <div id="files-list"></div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const logEl = $("log"), searchEl = $("search"), searchCount = $("search-count");
const pausedEl = $("paused"), noticeEl = $("notice"), dot = $("dot"), rejBanner = $("rej-banner");
const earlierBtn = $("btn-earlier");
const INITIAL_TAIL = 1000;
let MAX_NODES = 20000, offset = 0, firstOffset = 0, hasMore = false;
let paused = false, pending = [], autoScroll = true, onlyRej = false;
let viewMode = "raw", allLines = [], searchTimer = null;
let tab = "log";

const LEVEL_RE = /^(?:\[[^\]]*\]\s*)?\[[^\]]*\]\[(debug|info|warning|error|critical)\]/;
const PROGRESS_RE = /^\[\d+\/\d+\]/;
const TS_RE = /^\[([^\]]+)\]\s*\[([^\]]*)\]\[(\w+)\]\s?(.*)$/;
// keep in sync with REJECTION_RE in app.py (no bare \b429\b: matches "[429/500]")
let REJECTION_RE = /temporarily blocked|blocked from viewing|must be logged in|logged in to continue|AuthRequired|AuthorizationError|AuthenticationError|Invalid login credentials|credentials required|cookies needed|Too Many Requests|ChallengeError|captcha|FunCaptcha|GeeTest|hCaptcha|HttpError: '(?:401|403|429)|content isn't available/i;  // boot fallback, replaced by the server's pattern on the first poll

function levelOf(line) {
  const m = LEVEL_RE.exec(line);
  if (m) return m[1] === "critical" ? "error" : m[1];
  if (!line.trim() || line.startsWith("# ") || PROGRESS_RE.test(line)) return "other";
  return "download";
}
function isVisible(el) {
  if (onlyRej && !el.dataset.rej) return false;
  const q = searchEl.value.trim().toLowerCase();
  if (q && !el.textContent.toLowerCase().includes(q)) return false;
  let lvl = el.dataset.lvl;
  if (lvl === "download") lvl = "other";
  const cb = document.querySelector('.cb[data-lvl="' + lvl + '"]');
  return cb ? cb.checked : true;
}
function humanSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(0) + " KiB";
  return (n / 1048576).toFixed(1) + " MiB";
}
function trunc(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML.replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function qsel(s) { return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"'); }
// log timestamps are UTC ("YYYY-MM-DD HH:MM:SS"); display them in DISPLAY_TZ
let TZ = "UTC";
let tzFmt = null;
function tzFormatter() {
  if (!tzFmt) {
    // fr-FR + 2-digit year -> DD/MM/YY HH:MM:SS
    const opts = { timeZone: TZ, day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false };
    try { tzFmt = new Intl.DateTimeFormat("fr-FR", opts); }
    catch (e) { TZ = "UTC"; tzFmt = new Intl.DateTimeFormat("fr-FR", Object.assign({}, opts, { timeZone: "UTC" })); }
  }
  return tzFmt;
}
function setTZ(tz) { if (tz && tz !== TZ) { TZ = tz; tzFmt = null; } }
function fmtEpoch(sec) { return tzFormatter().format(new Date(sec * 1000)); }
function fmtTs(s) {
  if (!s) return "";
  const d = new Date(String(s).slice(0, 19).replace(" ", "T") + "Z");
  return isNaN(d.getTime()) ? String(s) : tzFormatter().format(d);
}
function tsEpoch(s) {
  if (!s) return NaN;
  return Date.parse(String(s).slice(0, 19).replace(" ", "T") + "Z");
}
function fmtDur(sec) {
  if (sec == null || !isFinite(sec)) return "";
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = (n) => String(n).padStart(2, "0");
  if (h) return h + "h" + p(m) + "m" + p(s) + "s";
  if (m) return m + "m" + p(s) + "s";
  return s + "s";
}
function parseEvent(line) {
  const m = TS_RE.exec(line);
  const ts = m ? m[1] : "";
  let lvl = m ? m[3].toLowerCase() : "other";
  if (lvl === "critical") lvl = "error";
  const msg = m ? m[4] : line;
  let icon = "•", text = msg, mm;
  if (REJECTION_RE.test(line)) icon = "🚫";
  else if ((mm = msg.match(/^Sleeping ([\d.]+) seconds \(([^)]+)\)/))) { icon = "💤"; text = "sleeping " + mm[1] + "s (" + mm[2] + ")"; }
  else if ((mm = msg.match(/^Starting (\w+)Job for '([^']+)'/))) { icon = "▶"; text = mm[1] + " job — " + mm[2]; }
  else if ((mm = msg.match(/^Using (\w+) for '([^']+)'/))) { icon = "🔍"; text = mm[1] + " — " + trunc(mm[2], 100); }
  else if ((mm = msg.match(/"GET ([^"]+) HTTP\/1\.1" (\d{3})(?: (\d+))?$/))) { icon = "🌐"; text = "GET " + mm[2] + (mm[3] ? " (" + humanSize(+mm[3]) + ")" : "") + " — " + trunc(mm[1], 90); }
  else if ((mm = msg.match(/^Adjusting filename extension of '([^']+)' to '(\w+)'/))) { icon = "🖼"; text = mm[1] + " → ." + mm[2]; }
  else if (msg.match(/^Failed to download '/)) { icon = "❌"; }
  else if (/^Starting new HTTPS connection/.test(msg)) { icon = "🔌"; }
  else if (/^Resetting dropped connection/.test(msg)) { icon = "🔁"; }
  else if (/^Version /.test(msg)) { icon = "📦"; text = msg; }
  else icon = { debug: "·", info: "ℹ", warning: "⚠", error: "✖" }[lvl] || "•";
  return { ts, lvl, icon, text };
}
function makeDiv(line) {
  const lvl = levelOf(line);
  const rej = REJECTION_RE.test(line);
  const div = document.createElement("div");
  div.dataset.lvl = lvl;
  if (rej) div.dataset.rej = "1";
  let cls = "line";
  if (viewMode === "parsed") {
    const ev = parseEvent(line);
    cls += " event " + ev.lvl;
    const ts = document.createElement("span"); ts.className = "ts"; ts.textContent = ev.ts ? fmtTs(ev.ts) + " " : "";
    const ic = document.createElement("span"); ic.className = "icon"; ic.textContent = ev.icon;
    const tx = document.createElement("span"); tx.textContent = ev.text;
    div.append(ts, ic, tx);
  } else {
    cls += " " + lvl;
    div.textContent = line;
  }
  if (rej) cls += " rej";
  div.className = cls;
  if (!isVisible(div)) div.classList.add("hidden");
  return div;
}
function scrollLogEnd() { const v = $("view-log"); v.scrollTop = v.scrollHeight; }
function appendLine(line) {
  allLines.push(line);
  if (allLines.length > MAX_NODES) allLines.shift();
  logEl.appendChild(makeDiv(line));
  while (logEl.childElementCount > MAX_NODES) logEl.firstChild.remove();
  if (autoScroll && !paused) scrollLogEnd();
}
function prependLines(lines) {
  allLines = lines.concat(allLines);
  if (allLines.length > MAX_NODES) allLines = allLines.slice(-MAX_NODES);
  const frag = document.createDocumentFragment();
  for (const line of lines) frag.appendChild(makeDiv(line));
  logEl.insertBefore(frag, logEl.firstChild);
}
function setDot(on) { dot.classList.toggle("on", on); }
function connect() {
  const es = new EventSource("/api/stream?since=" + offset);
  es.addEventListener("log", (ev) => {
    setDot(true);
    const msg = JSON.parse(ev.data);
    offset = msg.offset;
    if (paused) {
      pending.push(msg.line);
      if (pending.length > MAX_NODES) pending.shift();
      pausedEl.style.display = "block";
      pausedEl.textContent = "⏸ Paused — " + pending.length + " new line(s) — click \"Resume\"";
    } else {
      appendLine(msg.line);
    }
  });
  es.onopen = () => setDot(true);
  es.onerror = () => setDot(false);
}
function setPath(p) { $("st-path").textContent = p; $("st-path").title = p; }
function updateEarlierBtn() { earlierBtn.disabled = !hasMore; }
async function loadHistory() {
  fetch("/api/status").then(r => r.json()).then(st => setTZ(st.timezone)).catch(() => {});
  try {
    const r = await fetch("/api/logs?tail=" + INITIAL_TAIL);
    const data = await r.json();
    MAX_NODES = data.max_render || MAX_NODES;
    setPath(data.path);
    firstOffset = data.start_offset;
    hasMore = data.has_more;
    updateEarlierBtn();
    const frag = document.createDocumentFragment();
    for (const line of data.lines) { allLines.push(line); frag.appendChild(makeDiv(line)); }
    logEl.appendChild(frag);
    if (allLines.length >= MAX_NODES) {
      noticeEl.style.display = "block";
      noticeEl.textContent = "Display capped at " + MAX_NODES + " lines. Use \"Load earlier\" or search (match count covers the scanned file).";
    }
    offset = data.offset;
    scrollLogEnd();  // the log view opens scrolled at the END of the file
  } catch (e) { /* no log yet */ }
  connect();
}
async function loadEarlier() {
  if (!hasMore) return;
  earlierBtn.disabled = true;
  try {
    const r = await fetch("/api/logs?before=" + firstOffset + "&limit=2000");
    const data = await r.json();
    firstOffset = data.start_offset;
    hasMore = data.has_more;
    const v = $("view-log");
    const h0 = v.scrollHeight, s0 = v.scrollTop;
    prependLines(data.lines);
    v.scrollTop = s0 + (v.scrollHeight - h0);  // prepending must not move the viewport
  } catch (e) {}
  updateEarlierBtn();
}
function toggleView(mode) {
  if (viewMode === mode) return;
  viewMode = mode;
  $("btn-view-raw").classList.toggle("active", mode === "raw");
  $("btn-view-parsed").classList.toggle("active", mode === "parsed");
  logEl.innerHTML = "";
  const frag = document.createDocumentFragment();
  for (const line of allLines) frag.appendChild(makeDiv(line));
  logEl.appendChild(frag);
  if (autoScroll) scrollLogEnd();
}
function refilter() {
  for (const el of logEl.children) el.classList.toggle("hidden", !isVisible(el));
}

// ---------------------------------------------------------------- tabs + history (hash)
let pendingAlbum = null, pendingFile = null;
function hashState() {
  const h = location.hash;
  if (h.startsWith("#file=")) return { tab: "files", file: decodeURIComponent(h.slice(6)) };
  if (h.startsWith("#album=")) return { tab: "albums", album: decodeURIComponent(h.slice(7)) };
  if (["#log", "#tree", "#albums", "#files"].includes(h)) return { tab: h.slice(1) };
  return { tab: "log" };
}
function showTab(name) {
  tab = name;
  for (const t of ["log", "tree", "albums", "files"]) {
    $("tab-" + t).classList.toggle("active", t === name);
    $("view-" + t).classList.toggle("open", t === name);
  }
  if (name === "tree") refreshTree();
  else if (name === "albums") refreshOverview();
  else if (name === "files") loadFiles();
}
function goTab(name) {  // user action: pushes a history entry
  showTab(name);
  const h = "#" + name;
  if (location.hash !== h) history.pushState({ tab: name }, "", h);
}
function applyHash() {  // popstate/hashchange: never pushes
  const st = hashState();
  if (st.file) { applyFileHash(st.file); return; }
  showTab(st.tab);
  if (st.album) {
    pendingAlbum = st.album;
    if (tab === "albums") setTimeout(() => scrollToAlbum(st.album), 80);
  }
}
window.addEventListener("popstate", applyHash);
window.addEventListener("hashchange", applyHash);
for (const t of ["log", "tree", "albums", "files"])
  $("tab-" + t).addEventListener("click", () => goTab(t));
function scrollToAlbum(key) {
  const card = $("album-" + key) || $("album-" + encodeURIComponent(key));
  if (card) { card.scrollIntoView({ block: "start" }); card.style.borderColor = "var(--blue)"; }
}

// ---------------------------------------------------------------- status banner (fixed 3 lines, textContent updates)
const SB = {};
function initBanner() {
  const mk = (lineId, parts) => {
    const line = $(lineId);
    for (const pr of parts) {
      const s = document.createElement("span");
      s.className = "sb-part";
      s.id = pr[0];
      if (pr[1]) s.title = pr[1];
      SB[pr[0]] = s;
      line.appendChild(s);
      line.appendChild(document.createTextNode(" "));
    }
  };
  mk("sb-l1", [

const STATE_META = {

  missing:     { icon: "⚠️", cls: "incomplete", title: "Missing: download payload seen in logs (CDN) but the file is NOT on disk" },
  interrupted: { icon: "❌", cls: "pending",    title: "Interrupted: page seen in logs, no completed payload, not on disk (crash mid-write, failed download, ban)" },

function countersHtml(states) {  // 5 counters: Full / Interrupted / Missing / Already / Foreign

function makeLogPane(key, loader) {
  const det = document.createElement("details");
  det.className = "tnode logspane";

  const sum = document.createElement("summary");
  sum.textContent = "📜 raw log span";

  det.append(sum, pre);
  det.addEventListener("toggle", async () => {
    if (!det.open || det.dataset.loaded) return;
    det.dataset.loaded = "1";

    else pre.textContent = "loading…";
    try {

function paintPhotos(s, a, box) {

async function loadPhotos(s, a, box, offset) {
  try {
    const r = await (await fetch("/api/album/" + s + "/" + a + "?offset=" + offset + "&limit=" + PHOTOS_PAGE)).json();
    const key = s + "/" + a;
    const c = photosCache[key] || (photosCache[key] = { set_id: r.set_id, photos_n: 0, photos: [], painted: null });
    c.set_id = r.set_id;
    c.photos_n = r.photos_n;
    if (offset === 0) c.photos = r.photos.concat((c.photos || []).slice(r.photos.length));
    else c.photos = c.photos.concat(r.photos);
    const sig = JSON.stringify(c.photos) + "|" + c.photos_n;

async function refreshTree() {

      fetch("/api/tree").then(r => r.json()),
      fetch("/api/exif_stats").then(r => r.json()).catch(() => null),
    ]);
    treeData = t;
    if (ex) exifStats = ex;
    const sig = treeSignature(t, ex);
    if (sig === treeSig) return;  // nothing changed: keep the DOM as is (no flicker)
    treeSig = sig;
    renderTree();

function renderTree() {
  const t = treeData;
  if (!t) return;
  const view = $("view-tree"), root = $("tree-root");
  // preserve expanded nodes + scroll across live refreshes
  const openKeys = new Set([...root.querySelectorAll("details.tnode[data-key]")]
    .filter(d => d.open).map(d => d.dataset.key));
  const scroll = view.scrollTop;
  const lastS = t.sessions[t.sessions.length - 1];
  const frag = document.createDocumentFragment();
  for (const s of t.sessions) frag.appendChild(sessionNode(s, s === lastS));
  root.replaceChildren(frag);  // single swap: no intermediate empty-tree flash
  applyTreeFilter($("tree-q").value.trim().toLowerCase());
  for (const d of root.querySelectorAll("details.tnode[data-key]"))  // parents come first
    if (openKeys.has(d.dataset.key)) d.open = true;
  keepScroll(view, scroll);
  treeBooted = true;
  const albums = t.sessions.reduce((n, s) => n + s.albums.length, 0);
  const photos = t.sessions.reduce((n, s) => n + s.photos_n, 0);
  $("tree-count").textContent = t.sessions.length + " session(s) · " + albums + " album(s) · " + photos + " photo(s)";
}

  card.innerHTML = "<h3>📁 " + (a.name ? "<b>" + esc(a.name) + "</b> — " : "") +
    (a.link ? '<a href="' + esc(a.link) + '" target="_blank" rel="noopener">' + esc(trunc(a.url, 70)) + "</a>" : esc(trunc(a.url, 70))) +
    ' <a class="anchor" href="#album=' + esc(a.set_id || a.url) + '" title="permalink (browser history)">🔗</a>' +
    " " + badge(a.status, a.status) + (a.retried ? " " + badge("retried", "retried", "seen in more than one session") : "") +
    (a.set_id ? ' <span class="stat">set=a.' + esc(a.set_id) + (a.vanity ? " · vanity=" + esc(a.vanity) : "") + "</span>" : "") +
    "</h3><div class='n-l2'>" + countersHtml(a.states) +
    ' <span class="cnt" title="Cumulative sleep time over all sessions">💤 <b>' + a.sleeps.toFixed(1) + "s</b></span>" +
    ' <span class="cnt" title="Bytes downloaded (CDN payloads)">💾 <b>' + humanSize(a.bytes) + "</b></span>" +
    ' <span class="cnt">🖼 <b>' + a.photos + "</b> photos</span>" +
    ' <span class="cnt">📥 <b>' + a.files + "</b> downloaded</span>" +
    ' <span class="cnt" title="Files on disk for this album (match by fbid)">💽 <b>' + a.on_disk + "</b> on disk</span>" +
    (a.missing_on_disk ? ' <span class="cnt" title="Downloaded in logs but not on disk">⚠️ <b>' + a.missing_on_disk + "</b> missing</span>" : "") +
    (a.extra_on_disk ? ' <span class="cnt" title="On disk but never downloaded in logs">➕ <b>' + a.extra_on_disk + "</b> extra</span>" : "") +
    (a.errors ? ' <span class="cnt">✖ <b>' + a.errors + "</b></span>" : "") +
    (a.rejections ? ' <span class="cnt">🚫 <b>' + a.rejections + "</b></span>" : "") +
    (a.end_reason ? ' <span class="cnt">end: ' + esc(a.end_reason) + "</span>" : "") +
    "<br>sessions: " + a.sessions.map(x => "#" + x).join(", ") + "</div>";
  if (a.set_id) card.querySelector("h3").appendChild(copyBtn("a." + a.set_id));
  for (const sd of (a.session_details || [])) {
    const det = document.createElement("details");
    det.className = "tnode";
    det.dataset.key = "ov-" + (a.set_id || "x") + "-s" + sd.session;
    const sum = document.createElement("summary");
    sum.innerHTML = "💼 session <b>#" + sd.session + "</b> · " + esc(fmtTs(sd.session_start)) +
      " · album " + esc(fmtTs(sd.start)) + " → " + esc(fmtTs(sd.end)) + " " + badge(sd.status, sd.status, sd.end_reason || "") +
      ' <span class="stat">🖼 ' + sd.photos_n + " · 📥 " + sd.files + " · 💾 " + humanSize(sd.bytes) +
      (sd.sleeps ? " · 💤 " + sd.sleeps.toFixed(1) + "s" : "") +
      (sd.errors ? " · ✖ " + sd.errors : "") + (sd.rejections ? " · 🚫 " + sd.rejections : "") + "</span>";
    det.appendChild(sum);
    const box = document.createElement("div");
    box.className = "tree-indent";
    det.appendChild(box);
    let loaded = false;
    det.addEventListener("toggle", () => {
      if (!det.open || loaded) return;
      loaded = true;
      if (photosCache[sd.session + "/" + sd.album_idx]) paintPhotos(sd.session, sd.album_idx, box);
      loadPhotos(sd.session, sd.album_idx, box, 0);
    });
    card.appendChild(det);
  }
  return card;
}
function renderOverview() {
  const view = $("view-albums");
  const openKeys = new Set([...view.querySelectorAll("details.tnode[data-key]")]
    .filter(d => d.open).map(d => d.dataset.key));
  const scroll = view.scrollTop;
  renderCompare(compareData);
  const root = $("albums-root");
  const frag = document.createDocumentFragment();
  if (overviewData && overviewData.albums.length) {
    for (const a of overviewData.albums) frag.appendChild(albumCard(a));
  } else {
    const p = document.createElement("p");
    p.className = "stat";
    p.textContent = "no albums parsed yet";
    frag.appendChild(p);
  }
  root.replaceChildren(frag);  // single swap: no intermediate empty-list flash
  applyAlbumsFilter($("albums-q").value.trim().toLowerCase());
  for (const d of view.querySelectorAll("details.tnode[data-key]"))
    if (openKeys.has(d.dataset.key)) d.open = true;
  keepScroll(view, scroll);
  if (pendingAlbum) {
    const k = pendingAlbum;
    pendingAlbum = null;
    setTimeout(() => scrollToAlbum(k), 50);
  }
}
function applyAlbumsFilter(q) {
  for (const el of $("view-albums").querySelectorAll(".acmp"))
    el.classList.toggle("hidden", !!q && !el.textContent.toLowerCase().includes(q));
}
$("albums-q").addEventListener("input", () => applyAlbumsFilter($("albums-q").value.trim().toLowerCase()));

// ---------------------------------------------------------------- files view
let filesData = null;
const exifCache = {};
function exifOf(path) {
  if (!exifCache[path]) {
    exifCache[path] = fetch("/api/exif?path=" + encodeURIComponent(path))
      .then(r => r.ok ? r.json() : Promise.reject(r.status))
      .catch(() => null);
  }
  return exifCache[path];
}
async function loadFiles(refresh) {
  try {
    filesData = await (await fetch("/api/files" + (refresh ? "?refresh=1" : ""))).json();
    renderFiles();
  } catch (e) {}
}
const LOG_STATES = { full: 1, already: 1, foreign: 1 };
function renderFiles() {
  const el = $("files-list");
  if (!filesData) return;
  const albumSel = $("files-album");
  const curAlbum = albumSel.value, curState = $("files-state").value, q = $("files-q").value.trim().toLowerCase();
  const albums = [...new Set(filesData.files.map(f => f.album_set).filter(Boolean))].sort();
  if (albumSel.options.length <= 1) {
    for (const a of albums) {
      const o = document.createElement("option");
      o.value = a; o.textContent = a;  // album_set already includes the "a." prefix
      albumSel.appendChild(o);
    }
    albumSel.value = curAlbum || "";
  }
  el.innerHTML = "";
  const table = document.createElement("table");
  table.className = "files-table";
  let shown = 0, matched = 0;
  for (const f of filesData.files) {
    if (albumSel.value && f.album_set !== albumSel.value) continue;
    if (q && !(f.name.toLowerCase().includes(q) || (f.fbid || "").includes(q))) continue;
    if (curState in LOG_STATES && f.state !== curState) continue;
    matched++;
    if (shown >= 2000) break;
    shown++;
    const row = document.createElement("tr");
    row.dataset.path = f.path;
    row.innerHTML = '<td><img class="thumb" loading="lazy" src="/api/thumb?path=' + encodeURIComponent(f.path) + '&w=120" onerror="this.style.display=&quot;none&quot;"></td>' +
      "<td>" + esc(f.name) + (f.fbid ? '<br><span class="stat">fbid=' + esc(f.fbid) + "</span>" : "") + "</td>" +
      '<td class="stat">' + humanSize(f.size) + "</td>" +
      '<td class="stat">' + esc(f.name_date || "?") + "</td>" +
      '<td class="stat">' + esc(fmtEpoch(f.mtime)) + "</td>" +
      '<td class="stat">' + esc(f.album_set || "?") + "</td>" +
      '<td class="stat">' + (f.state ? stateBadge(f.state) : (f.in_log ? "✓ in log" : "✗ not in log")) + "</td>" +
      '<td><button class="exif-btn">exif</button> <span class="exif-res"></span></td>';
    const btn = row.querySelector(".exif-btn");
    const res = row.querySelector(".exif-res");
    const paintExif = async () => {
      const ex = await exifOf(f.path);
      if (!ex || ex.mtime == null) { res.textContent = "error"; return; }
      res.innerHTML = badge(ex.state, ex.state === "synced" ? "done" : "error",
        "EXIF DateTimeOriginal " + (ex.exif || "none") + " (interpreted in " + ex.tz + ") · mtime " + fmtEpoch(ex.mtime) +
        (ex.diff_s != null ? " · Δ" + ex.diff_s + "s" : "")) +
        " " + esc(ex.exif || "no exif");
      if (curState !== "all" && !(curState in LOG_STATES) && ex.state !== curState) row.style.display = "none";
    };
    let done = false;
    btn.addEventListener("click", async () => {
      if (done) return;
      done = true;
      btn.disabled = true;
      await paintExif();
    });
    if (curState !== "all" && !(curState in LOG_STATES)) paintExif();  // lazy exif state filter
    table.appendChild(row);
  }
  el.appendChild(table);
  $("files-count").textContent = filesData.count + " file(s) on disk" +
    (filesData.truncated ? " (index capped at FILES_MAX)" : "") +
    (filesData.in_log_count != null ? ", " + filesData.in_log_count + " downloaded in logs" : "") +
    ", " + matched + " shown";
  if (!shown) el.innerHTML = "<p class='stat'>no files</p>";
  if (pendingFile) {  // #file=<path> : scroll to + highlight the row
    const row = el.querySelector('tr[data-path="' + qsel(pendingFile) + '"]');
    if (row) {
      row.scrollIntoView({ block: "center" });
      row.classList.add("hl");
      setTimeout(() => row.classList.remove("hl"), 5000);
    }
    pendingFile = null;
  }
}
function applyFileHash(path) {  // #file=<path> : open Files view filtered on this file
  pendingFile = path;
  const m = /_(\d{6,})\.[A-Za-z0-9]+$/.exec(decodeURIComponent(path));
  $("files-q").value = m ? m[1] : decodeURIComponent(path).split("/").pop();
  showTab("files");
}
$("files-album").addEventListener("change", renderFiles);
$("files-state").addEventListener("change", renderFiles);
$("files-q").addEventListener("input", renderFiles);
$("files-refresh").addEventListener("click", () => loadFiles(true));

// ---------------------------------------------------------------- header controls
searchEl.addEventListener("input", () => {
  refilter();
  clearTimeout(searchTimer);
  const q = searchEl.value.trim();
  if (!q) { searchCount.textContent = ""; return; }
  searchTimer = setTimeout(async () => {
    try {
      const s = await (await fetch("/api/search?q=" + encodeURIComponent(q) + "&limit=1")).json();
      searchCount.textContent = s.count + " match(es)" + (s.truncated ? " (tail scan)" : "");
    } catch (e) {}
  }, 300);
});
document.querySelectorAll(".cb").forEach(cb => cb.addEventListener("change", refilter));
rejBanner.addEventListener("click", () => {
  // jump to the first rejection line in the Log tab (rejection-only filter on)
  onlyRej = true;
  rejBanner.classList.add("active");
  goTab("log");
  refilter();
  const first = logEl.querySelector(".line.rej:not(.hidden)");
  if (first) first.scrollIntoView({ block: "center" });
});
$("btn-view-raw").addEventListener("click", () => toggleView("raw"));
$("btn-view-parsed").addEventListener("click", () => toggleView("parsed"));
$("btn-earlier").addEventListener("click", loadEarlier);
$("btn-clear").addEventListener("click", () => { logEl.innerHTML = ""; allLines = []; });
$("btn-scroll").addEventListener("click", (e) => {
  autoScroll = !autoScroll;
  e.target.classList.toggle("active", autoScroll);
  if (autoScroll) scrollLogEnd();
});
$("btn-pause").addEventListener("click", (e) => {
  paused = !paused;
  e.target.textContent = paused ? "▶ Resume" : "⏸ Pause";
  e.target.classList.toggle("active", paused);
  if (!paused) {
    pausedEl.style.display = "none";
    const lines = pending; pending = [];
    lines.forEach(appendLine);
    if (autoScroll) scrollLogEnd();
  }
});

// ---------------------------------------------------------------- poll (banner + header + live tree/albums)
async function poll() {
  try {
    const s = await (await fetch("/api/summary")).json();
    setTZ(s.timezone);
    if (s.rejection_regex && REJECTION_RE.source !== s.rejection_regex)
      REJECTION_RE = new RegExp(s.rejection_regex, "i");  // single source of truth: the server's pattern
    updateBanner(s);
    $("st-lines").textContent = s.lines + (s.truncated ? " (tail)" : "");
    $("st-warn").textContent = s.warnings;
    $("st-err").textContent = s.errors;
    $("st-size").textContent = s.exists ? humanSize(s.log_size) : "no log file yet";
    const nrej = s.rejections || 0;
    if (nrej > 0) {
      rejBanner.style.display = "";
      rejBanner.textContent = "🚫 " + nrej + " rejection(s) — click to jump to the first one";
    } else {
      rejBanner.style.display = "none";
      if (onlyRej) { onlyRej = false; rejBanner.classList.remove("active"); refilter(); }
    }
    if (tab === "tree") refreshTree();       // live refresh, expanded nodes + scroll preserved
    else if (tab === "albums") refreshOverview();
  } catch (e) {}
  setTimeout(poll, 5000);
}

initBanner();
loadHistory();
poll();
applyHash();
</script>
