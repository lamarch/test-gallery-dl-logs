services:
  fb-dl:
    container_name: fb-dl
    image: gallery-dl:latest
    restart: "no"
    user: "1000:1000"
    volumes:
      - ./downloads-2:/downloads
      - ./config:/config
    command:
      - -c
      - /config/gallery-dl.conf
      - -I
      - /config/albums.txt
      - --verbose

  webui:
    build: ./web-ui-logs
    container_name: fb-dl-dashboard
    restart: unless-stopped
    environment:
      LOG_FILE: /downloads/logs/fb-dl.log   # output.logfile.path from config/gallery-dl.conf
      ALBUMS_FILE: /config/albums.txt       # the -I input file
      MAX_RENDER_LINES: "20000"             # optional: browser DOM cap
    volumes:
      - ./downloads-2:/downloads:ro
      - ./config:/config:ro                 # contains cookies: gitignored, never committed
    networks:
      - caddy

networks:
  caddy:
    external: true
