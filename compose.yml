services:
  fb-dl:
    container_name: fb-dl
    image: gallery-dl:latest
    restart: "no"
    user: "1000:1000"
    volumes:
      - ./downloads-2:/downloads
      - ./config:/config
    command:
      - -c
      - /config/gallery-dl.conf
      - -I
      - /config/albums.txt
      - --verbose

  webui:
    build: ./webui
    container_name: fb-dl-dashboard
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8081}:8081"
    environment:
      LOG_FILE: /downloads/logs/fb-dl.log
      TAIL_LINES: "500"
    volumes:
      - ./downloads-2:/downloads:ro
