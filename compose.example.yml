# Snippet to paste into YOUR compose.yml at the project root
# (./gallery-dl/compose.yml), under the existing `services:` key, next to fb-dl.
# This repo's content is expected in ./web-dashboard/ (the build context).
# If your compose already has a top-level `networks:` section, merge the
# `caddy` entry into it instead of redeclaring it.
#
# NOTE: mount ONLY config/albums.txt, never the whole config/ dir — it contains
# fb-cookies.txt and this container does not need it. `touch config/albums.txt`
# first if the file does not exist yet (a missing single-file bind mount would
# be created as a directory by Docker).
services:
  webui:
    build: ./web-dashboard
    container_name: fb-dl-dashboard
    restart: unless-stopped
    user: "1000:1000"                       # same uid as fb-dl: can read the log
    security_opt:
      - no-new-privileges:true
    environment:
      LOG_FILE: /downloads/logs/fb-dl.log   # output.logfile.path from config/gallery-dl.conf
      ALBUMS_FILE: /config/albums.txt       # the -I input file (single file mount)
      MAX_RENDER_LINES: "20000"             # browser DOM cap
      SCAN_MAX_BYTES: "134217728"           # stats/search/tree scan only the last 128 MiB (log grows unbounded in mode "a")
      PHOTOS_PAGE_SIZE: "500"               # photos per page in the tree view ("load more"); keeps big albums light
      TREE_MAX_PHOTOS: "50000"              # RAM cap on materialized photo nodes in the parsed tree; beyond it, albums are re-parsed from their log span on demand
      DISPLAY_TZ: "Europe/Paris"            # log timestamps are UTC; the UI displays them in this IANA timezone (falls back to TZ, then UTC). EXIF DateTimeOriginal is also interpreted in this zone
      EXIF_TOLERANCE_S: "2"                 # |mtime - exif| tolerance for the exif "synced" state
      ALBUMS_NAMES_FILE: /config/albums-names.txt   # optional album display names, one "<a.set_id or url> <name>" per line
      FILES_CACHE_TTL: "30"                 # seconds the disk index (/api/files) is cached before an automatic rescan (0 = rescan every call)
    volumes:
      - ./downloads-2:/downloads:ro         # same mount as fb-dl, read-only
      - ./config/albums.txt:/config/albums.txt:ro
      # optional, only if you use album display names (ALBUMS_NAMES_FILE):
      # touch config/albums-names.txt first, then add:
      # - ./config/albums-names.txt:/config/albums-names.txt:ro
    networks:
      - caddy

networks:
  caddy:
    external: true
